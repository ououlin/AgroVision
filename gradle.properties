# ==================== JVM / Kotlin 编译器 ====================
# Kotlin 编译器以独立 daemon 进程运行，避免每次构建重启 JVM（节省 5-10s 冷启动）
kotlin.compiler.execution.strategy=daemon
# 启用 Kotlin 增量编译（项目路径已是纯英文 e:\nong\AgroVision，可安全启用）
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# KSP 增量编译（项目路径已是纯英文，之前的中文路径问题不再适用）
ksp.incremental=true
ksp.incremental.intermodule=true

# ==================== Android ====================
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true

# ==================== Gradle 构建加速 ====================
org.gradle.parallel=true
org.gradle.caching=true
# 启用 configuration cache：配置阶段只跑一次，后续构建复用
# AGP 8.7 + Kotlin 2.0 已完整支持
org.gradle.configuration-cache=true
# daemon 进程复用（默认已开，显式声明）
org.gradle.daemon=true
# 构建缓存目录显式化（避免被 IDE 当作临时文件清理）
org.gradle.cache.locked=false

# ==================== JVM 内存配置 ====================
# 增大 metaspace 和 code cache，避免 Kotlin/AGP 重编译类时频繁 GC
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseCodeCacheFlushing -XX:+UseParallelGC -XX:+TieredCompilation -Dfile.encoding=UTF-8

# ==================== 网络超时（镜像已配阿里云，200ms 延迟）====================
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000

# ========================================================================
# 【Release 签名】上架前务必配置以下 4 项（不要把真实值提交 Git！）
# 推荐：在项目外新建 keystore 目录，然后用绝对路径指向 jks。
# 生成 jks 示例命令：
#   keytool -genkeypair -v -keystore D:\keystore\agrovision-release.jks \
#       -alias agrovision -keyalg RSA -keysize 2048 -validity 36500
# ========================================================================
# KEYSTORE_FILE=D:\\keystore\\agrovision-release.jks
# KEYSTORE_PASSWORD=your_store_password
# KEY_ALIAS=agrovision
# KEY_PASSWORD=your_key_password
